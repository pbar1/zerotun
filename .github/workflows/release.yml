name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: |
            type=local,dest=target/image
            type=oci,dest=dist/image-${{ matrix.arch }},tar=false
          cache-from: type=gha,scope=image-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ runner.arch }}
      - name: Check release version
        env:
          VERSION: ${{ github.ref_name }}
        run: cargo xtask check-version target/image/zerotun "$VERSION"
      - name: Test
        run: cargo xtask test
      - name: Test shipped binary
        env:
          ZEROTUN_BENCH_BIN: ${{ github.workspace }}/target/image/zerotun
        run: cargo xtask bench -- --test
      - name: Name release binary
        run: mv target/image/zerotun "dist/zerotun-linux-${{ matrix.arch }}"
      - name: Save image and binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Download images and binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true
      - name: Setup crane and login to GHCR
        uses: imjasonh/setup-crane@v0.7
      - name: Setup Cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Publish, sign, and verify images
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GH_REPO,,}"
          amd64="$(crane push dist/image-amd64 "$image:$VERSION-amd64")"
          arm64="$(crane push dist/image-arm64 "$image:$VERSION-arm64")"
          index="$(crane index append --tag "$image:$VERSION" \
            --manifest "$amd64" --manifest "$arm64")"
          cosign sign --yes "$amd64" "$arm64"
          cosign sign --yes --recursive "$index"
          cosign verify \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$index" "$amd64" "$arm64"
      - name: Publish release binaries
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          sha256sum zerotun-linux-* > SHA256SUMS
          gh release create "$VERSION" --verify-tag --generate-notes \
            zerotun-linux-* SHA256SUMS
